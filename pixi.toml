[workspace]
authors = ["Barbara Verhaar <barbaraverhaar@MacBook-Pro-van-Barbara.local>"]
channels = ["conda-forge", "bioconda"]
name = "helius_longitudinal"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
# Data cleaning (runs before all chapters)
datacleaning        = "Rscript scripts/0_run_workflows/3_data_cleaning/datacleaning.R"
qc-summary          = "Rscript scripts/0_run_workflows/4_qc_summary/qc_summary.R"

# Chapter 1 — Longitudinal change
lc-table1           = "Rscript scripts/1_longitudinal_change/1_table1.R"
lc-ordination-calc  = "Rscript scripts/1_longitudinal_change/2a_ordination_calc.R"
lc-ordination       = { cmd = "Rscript scripts/1_longitudinal_change/2c_ordination.R", depends-on = ["lc-ordination-calc"] }
lc-alphadiv         = "Rscript scripts/1_longitudinal_change/3_alphadiversity.R"
lc-assemble         = { cmd = "Rscript scripts/1_longitudinal_change/5_assemble_figure.R", depends-on = ["lc-table1", "lc-ordination", "lc-alphadiv"] }
lc-all              = { depends-on = ["lc-table1", "lc-ordination", "lc-alphadiv", "lc-assemble"] }

# Chapter 2 — CMB microbiome
cmb-betadiv         = "Rscript scripts/2_cmb_microbiome/1_betadiversity_cmb_16s.R"
cmb-alphadiv        = "Rscript scripts/2_cmb_microbiome/2_alphadiversity_cmb_16s.R"
cmb-assemble        = { cmd = "Rscript scripts/2_cmb_microbiome/3_assemble_figure.R", depends-on = ["cmb-betadiv", "cmb-alphadiv"] }
cmb-all             = { depends-on = ["cmb-betadiv", "cmb-alphadiv", "cmb-assemble"] }

# Chapter 3 — Comparison 16S + Species-level LMMs + clinical associations + Alistipes + strain stability
sc-ordination      = "Rscript scripts/3_species_change/1_comparison_16s/1_ordination_sg.R"
sc-alphadiv        = "Rscript scripts/3_species_change/1_comparison_16s/2_alphadiversity_sg.R"
sc-comparison      = { depends-on = ["sc-ordination", "sc-alphadiv"] }
sc-lmm-sg          = "Rscript scripts/3_species_change/2_species/1_lmm_sg.R"
sc-clinassoc-sg    = "Rscript scripts/3_species_change/2_species/2_heatmap.R"
sc-acquisition     = "Rscript scripts/3_species_change/2_species/3_acquisition_alistipes.R"
sc-species         = { depends-on = ["sc-lmm-sg", "sc-clinassoc-sg", "sc-acquisition"] }
# Alistipes: draw-tree writes tip_meta_clades.RDS, which the QC plots and inStrain scripts read
sc-alistipes-vfdb  = "Rscript scripts/3_species_change/3_alistipes_anno/1_vfdb_comparison.R"
sc-alistipes-tree  = "Rscript scripts/3_species_change/3_alistipes_anno/2_draw_tree.R"
sc-alistipes-qc    = { cmd = "Rscript scripts/3_species_change/3_alistipes_anno/3_qc_metadata_plots.R", depends-on = ["sc-alistipes-tree"] }
sc-alistipes       = { depends-on = ["sc-alistipes-vfdb", "sc-alistipes-tree", "sc-alistipes-qc"] }

# inStrain strain retention: needs the inStrain outputs from Snellius, so not part of sc-all
sc-instrain-retention  = { cmd = "Rscript scripts/3_species_change/4_instrain/1_instrain_strain_retention.R", depends-on = ["sc-alistipes-tree"] }
sc-instrain-between    = { cmd = "Rscript scripts/3_species_change/4_instrain/2_instrain_between_person.R", depends-on = ["sc-instrain-retention"] }
sc-instrain-microdiv   = { cmd = "Rscript scripts/3_species_change/4_instrain/3_instrain_microdiversity.R", depends-on = ["sc-instrain-retention"] }
sc-instrain            = { depends-on = ["sc-instrain-retention", "sc-instrain-between", "sc-instrain-microdiv"] }

# Strain sharing
sc-strainsharing-cov = "Rscript scripts/3_species_change/5_strain_stability/strainsharing_covariates.R"
sc-strainsharing   = "Rscript scripts/3_species_change/5_strain_stability/strainsharing_plot.R"

sc-assemble        = "Rscript scripts/3_species_change/assemble_figure.R"
sc-all             = { depends-on = ["sc-comparison", "sc-species", "sc-alistipes", "sc-strainsharing", "sc-strainsharing-cov", "sc-assemble"] }

# Chapter 4 — Functional change
fc-humann-cross     = "Rscript scripts/4_functional_change/humann/1_cross_sectional_humann.R"
fc-humann-lmm       = { cmd = "Rscript scripts/4_functional_change/humann/2_lmm_humann.R", depends-on = ["fc-humann-cross"] }
fc-humann           = { depends-on = ["fc-humann-cross", "fc-humann-lmm"] }
fc-cayman-qc        = "Rscript scripts/4_functional_change/cayman/1_cayman_qc.R"
fc-cayman-cross     = { cmd = "Rscript scripts/4_functional_change/cayman/2_cayman_cross_comparisons.R", depends-on = ["fc-cayman-qc"] }
fc-cayman-lmm       = { cmd = "Rscript scripts/4_functional_change/cayman/3_cayman_longitudinal_lmm.R", depends-on = ["fc-cayman-cross"] }
fc-cayman-ordin     = { cmd = "Rscript scripts/4_functional_change/cayman/4_cayman_ordination.R", depends-on = ["fc-cayman-qc"] }
fc-cayman-ratios    = { cmd = "Rscript scripts/4_functional_change/cayman/5_cayman_ratios.R", depends-on = ["fc-cayman-qc"] }
fc-cayman           = { depends-on = ["fc-cayman-qc", "fc-cayman-cross", "fc-cayman-lmm", "fc-cayman-ordin", "fc-cayman-ratios"] }
fc-assemble         = { cmd = "Rscript scripts/4_functional_change/assemble_figure.R", depends-on = ["fc-humann-lmm", "fc-cayman-lmm", "fc-cayman-ordin", "fc-cayman-ratios"] }
fc-all              = { depends-on = ["fc-humann", "fc-cayman", "fc-assemble"] }

# Chapter 5 — ARG
arg-qc              = "Rscript scripts/5_arg/1_arg_descriptive_qc.R"
arg-cross           = { cmd = "Rscript scripts/5_arg/2_arg_cross_comparisons.R", depends-on = ["arg-qc"] }
arg-lmm             = { cmd = "Rscript scripts/5_arg/3_arg_longitudinal_lmm.R", depends-on = ["arg-qc"] }
arg-assemble        = { cmd = "Rscript scripts/5_arg/4_assemble_figure.R", depends-on = ["arg-qc", "arg-cross", "arg-lmm"] }
arg-all             = { depends-on = ["arg-qc", "arg-cross", "arg-lmm", "arg-assemble"] }

# Run everything
all                 = { depends-on = ["datacleaning", "lc-all", "cmb-all", "sc-all", "fc-all", "arg-all"] }

[dependencies]
r-tidyverse = ">=2.0.0,<3"
r-ggpubr = ">=0.6.2,<0.7"
r-ggsci = ">=4.2.0,<5"
r-base = ">=4.5.2,<4.6"
r-rio = ">=1.2.4,<2"
r-vegan = ">=2.7_2,<3"
r-ggthemes = ">=5.2.0,<6"
r-ape = ">=5.8_1,<6"
r-emmeans = ">=2.0.1,<3"
r-picante = ">=1.8.2,<2"
r-biocmanager = ">=1.30.27,<2"
bioconductor-phyloseq = { version = ">=1.50.0,<2", channel = "bioconda" }
r-afex = ">=1.5_1,<2"
r-stringi = ">=1.8.7,<2"
r-stringr = ">=1.6.0,<2"
r-doparallel = ">=1.0.17,<2"
r-mixomics = ">=6.3.2,<7"
r-gghalves = ">=0.1.4,<0.2"
r-tableone = ">=0.13.2,<0.14"
r-magick = ">=2.9.1,<3"
r-pdftools = ">=3.4.1,<4"
r-cowplot = ">=1.1.3,<2"
python = ">=3.10,<3.13"
xgboost = ">=2.0,<3"
numpy = ">=1.26,<2"
pandas = ">=2.0,<3"
scikit-learn = ">=1.4,<2"
matplotlib = ">=3.8,<4"
psutil = ">=5.9,<7"
r-ggridges = ">=0.5.7,<0.6"
r-cairo = ">=1.7_0,<2"
r-circlize = ">=0.4.16,<0.5"
bioconductor-complexheatmap = ">=2.26.1,<3"
r-aplot = ">=0.2.9,<0.3"
bioconductor-ggtree = ">=4.0.4,<5"
r-ggnewscale = ">=0.5.2,<0.6"
bioconductor-ggtreeextra = ">=1.20.1,<2"
r-ggalluvial = ">=0.12.6,<0.13"
