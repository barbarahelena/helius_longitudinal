[workspace]
authors = ["Barbara Verhaar <barbaraverhaar@MacBook-Pro-van-Barbara.local>"]
channels = ["conda-forge", "bioconda"]
name = "helius_longitudinal"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
# 1 — Comparison 16S / ordination
sc-ordination      = "Rscript scripts/3_species_change/1_comparison_16s/ordination_sg.R"
sc-alphadiv        = "Rscript scripts/3_species_change/1_comparison_16s/alphadiversity_sg.R"
sc-comparison      = { depends-on = ["sc-ordination", "sc-alphadiv"] }

# 2 — Species-level LMMs + clinical associations
sc-lmm-sg          = "Rscript scripts/3_species_change/2_species/lmm_sg.R"
sc-lmm-16s         = "Rscript scripts/3_species_change/2_species/lmm_16s.R"
sc-clinassoc-sg    = "Rscript scripts/3_species_change/2_species/clinassociations_sg.R"
sc-clinassoc-16s   = "Rscript scripts/3_species_change/2_species/clinassociations_16s.R"
sc-species         = { depends-on = ["sc-lmm-sg", "sc-lmm-16s", "sc-clinassoc-sg", "sc-clinassoc-16s"] }

# 3 — Strain stability
sc-strainsharing   = "Rscript scripts/3_species_change/3_strain_stability/strainsharing.R"

# 4 — Alistipes annotation
sc-eggnog          = "Rscript scripts/3_species_change/4_alistipes_anno/eggnog_comparison.R"
sc-vfdb            = "Rscript scripts/3_species_change/4_alistipes_anno/vfdb_comparison.R"
sc-alistipes       = { depends-on = ["sc-eggnog", "sc-vfdb"] }

# 5 — ML ethnicity models
ml-prep            = "Rscript scripts/3_species_change/5_mlmodels/1_ml_prep/ml_prep_shotgun_timeeth.R"
ml-run             = { cmd = "bash scripts/3_species_change/5_mlmodels/2_ml_model/time_eth_shotgun.sh"}
ml-process         = "Rscript scripts/3_species_change/5_mlmodels/3_ml_processing/process_eth_time_models_shotgun.R"
ml-ethnicity       = { depends-on = ["ml-prep", "ml-run", "ml-process"] }

# Figure assembly
sc-assemble        = "Rscript scripts/3_species_change/assemble_figure.R"

# Run full chapter 3
sc-all             = { depends-on = ["sc-comparison", "sc-species", "sc-strainsharing", "sc-alistipes", "ml-ethnicity", "sc-assemble"] }

[dependencies]
r-tidyverse = ">=2.0.0,<3"
r-ggpubr = ">=0.6.2,<0.7"
r-ggsci = ">=4.2.0,<5"
r-base = ">=4.5.2,<4.6"
r-rio = ">=1.2.4,<2"
r-vegan = ">=2.7_2,<3"
r-ggthemes = ">=5.2.0,<6"
r-ape = ">=5.8_1,<6"
r-emmeans = ">=2.0.1,<3"
r-picante = ">=1.8.2,<2"
r-biocmanager = ">=1.30.27,<2"
bioconductor-phyloseq = { version = ">=1.50.0,<2", channel = "bioconda" }
r-afex = ">=1.5_1,<2"
r-stringi = ">=1.8.7,<2"
r-stringr = ">=1.6.0,<2"
r-doparallel = ">=1.0.17,<2"
r-mixomics = ">=6.3.2,<7"
r-gghalves = ">=0.1.4,<0.2"
r-tableone = ">=0.13.2,<0.14"
r-magick = ">=2.9.1,<3"
r-pdftools = ">=3.4.1,<4"
r-cowplot = ">=1.1.3,<2"
python = ">=3.10,<3.13"
xgboost = ">=2.0,<3"
numpy = ">=1.26,<2"
pandas = ">=2.0,<3"
scikit-learn = ">=1.4,<2"
matplotlib = ">=3.8,<4"
psutil = ">=5.9,<7"
r-ggridges = ">=0.5.7,<0.6"
r-cairo = ">=1.7_0,<2"
r-circlize = ">=0.4.16,<0.5"
bioconductor-complexheatmap = ">=2.26.1,<3"
r-aplot = ">=0.2.9,<0.3"
